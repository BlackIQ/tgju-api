[project]
name = "tgju-api"
version = "1.3.0"
description = "TGJU scrapper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "bs4>=0.0.2",
    "fastapi[standard]>=0.140.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.52",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.vercel]
entrypoint = "main:app"
